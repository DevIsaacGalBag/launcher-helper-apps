name: Build and release

# Compila Jarvis como ejecutable standalone (con PyInstaller) para Windows y
# Linux, y publica los artefactos en un GitHub Release. Se dispara al pushear
# un tag "vX.Y.Z" o manualmente desde la pestaña Actions.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist_name: Jarvis.exe
            asset_name: Jarvis-Windows.exe
          - os: ubuntu-latest
            dist_name: Jarvis
            asset_name: Jarvis-Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias del proyecto y de build
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Instalar dependencias del sistema (Linux, para Tkinter)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Compilar con PyInstaller
        run: >
          pyinstaller --onefile --windowed --name Jarvis
          --collect-all edge_tts --collect-all certifi
          config_gui.py

      - name: Renombrar artefacto
        shell: bash
        run: mv "dist/${{ matrix.dist_name }}" "dist/${{ matrix.asset_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
